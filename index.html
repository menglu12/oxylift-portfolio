<section class="cs-section cs-hero" id="overview"><span class="cs-label hero-item">PROJECT 01 / OPERATIONS SYSTEM DESIGN</span><h1 class="hero-item">OXYLIFT</h1><div class="cn hero-item">门店升单动作工作台</div><blockquote class="hero-item">把依赖个人经验的门店升单沟通，拆成<span class="accent">可判断、可执行、可反馈、可审核、可沉淀</span>的标准化运营闭环。</blockquote><p class="en hero-item">From frontline experience to a structured operating system.</p><div class="cs-actions hero-item"><a class="cs-btn primary" href="#snapshot">VIEW CASE STUDY ↓</a><a class="cs-btn" href="#home">ENTER INTERACTIVE DEMO ↗</a></div><div class="meta-grid hero-item"><div><small>ROLE</small><b>Operation Design / Product Thinking / Vibe Coding</b></div><div><small>TYPE</small><b>Self-initiated Case Study</b></div><div><small>OUTPUT</small><b>Interactive HTML Prototype</b></div><div><small>STATUS</small><b>Synthetic Demo Validation</b></div></div></section>
<section class="cs-section" id="snapshot"><span class="cs-label">01 / PROJECT SNAPSHOT</span><h2 class="reveal">我从门店沟通链路入手，重新拆解现场输入、判断、执行、反馈与沉淀五个环节。</h2><div class="split"><p class="cs-copy reveal">门店沟通的核心问题集中在五处：现场信息缺少结构、判断标准不统一、动作难以复用、专业边界不明确，执行结果也未进入下一轮规则优化。</p><div class="editorial-grid reveal"><div><small>PROJECT</small><b>OXYLIFT</b></div><div><small>TYPE</small><b>Operations System Design</b></div><div><small>OBJECT</small><b>Frontline Store Communication</b></div><div><small>CORE OUTPUT</small><b>Interactive Workflow Prototype</b></div><div><small>VALIDATION</small><b>9 Synthetic Test Cases</b></div><div><small>TECH</small><b>HTML / CSS / JavaScript / LocalStorage</b></div></div></div></section>
<section class="cs-section"><span class="cs-label">02 / BACKGROUND</span><h2 class="reveal">现场的复杂性，无法只靠一句标准话术解决。</h2><div class="split"><p class="cs-copy reveal">面对预算敏感、方案比较、明确拒绝，以及疼痛、恢复期、适用性或用药等专业问题，如果所有场景都依赖个人临场判断，就会不断重复同样的运营损耗。</p><div class="number-list"><article class="reveal"><h3>表达不一致</h3><p>不同员工面对相似问题可能采取完全不同的沟通方式。</p></article><article class="reveal"><h3>边界不一致</h3><p>普通运营沟通和专业判断之间容易出现模糊区域。</p></article><article class="reveal"><h3>经验难沉淀</h3><p>一次现场经验结束后，很难进入下一次运营决策。</p></article></div></div></section>
<section class="cs-section" id="problem"><span class="cs-label">03 / PROBLEM</span><h2 class="reveal">门店沟通链路存在五个关键断点。</h2><div class="break-flow"><article class="flow-item reveal"><b>01</b><h3>现场信息</h3><p>顾客表达通常是非结构化自然语言。</p></article><article class="flow-item reveal"><b>02</b><h3>判断</h3><p>依赖个人经验，没有统一优先级。</p></article><article class="flow-item reveal"><b>03</b><h3>执行</h3><p>判断之后缺少直接可执行动作。</p></article><article class="flow-item reveal"><b>04</b><h3>反馈</h3><p>现场结果没有进入审核机制。</p></article><article class="flow-item reveal"><b>05</b><h3>沉淀</h3><p>经验无法形成可检索案例资产。</p></article></div><p class="conclusion reveal">因此，解决方案需要覆盖从现场输入到案例沉淀的完整链路。</p></section>
<section class="cs-section"><span class="cs-label">04 / DIAGNOSIS</span><h2 class="reveal">输入、判断与反馈完成结构化后，一线经验才能规模化复用。</h2><div class="sticky-story"><aside class="sticky-side">EXPERIENCE<br>≠<br>SYSTEM<small>Only structured experience can be reused.</small></aside><div><article class="story-step reveal"><h3>01 / 非结构化输入</h3><p>“预算有限，但愿意了解不同方案。”<br>“我已经决定不做了。”<br>“恢复期多久，会不会疼？”</p><p class="mono-list">category · stage · quote · goal · budget · attitude · question</p></article><article class="story-step reveal"><h3>02 / 判断需要规则优先级</h3><p><b>专业风险 ↓ 明确拒绝 ↓ 普通沟通</b></p><p>Safety-first Rule Priority 依据业务边界和风险优先级完成判断。</p></article><article class="story-step reveal"><h3>03 / 结果必须回流</h3><p>Execution ↓ Feedback ↓ Manager Review ↓ Ops Review ↓ Archive ↓ Rule Candidate</p></article></div></div></section>
<section class="cs-section" id="system"><span class="cs-label">05 / STRATEGY</span><h2 class="reveal">基于这一判断，我设计了一套最小可运行的运营闭环。</h2><div class="system-flow flow-trigger">${[['INPUT','输入标准化'],['RULE PRIORITY','规则优先级'],['ACTION CARD','动作卡'],['EXECUTION','现场执行'],['FEEDBACK','执行反馈'],['REVIEW','人工审核'],['ARCHIVE','案例沉淀'],['NEXT RULE','规则候选']].map(x=>`<div class="flow-node"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><p class="cs-copy reveal">系统职责聚焦于三类业务边界：允许继续沟通、必须停止推荐、必须转交专业人员；随后将可执行动作与现场反馈进一步结构化。</p></section>
<section class="cs-section"><span class="cs-label">06 / SYSTEM DESIGN</span><h2 class="reveal">运营策略进一步拆解为规则、动作与组织机制。</h2><div class="design-module"><div class="rule-paths"><article class="rule-path"><span class="rid">R01 · HIGHEST PRIORITY</span><h3>PROFESSIONAL HANDOFF</h3><p>疼痛 / 风险 / 恢复期 / 疗效 / 适用 / 用药</p><p>暂停升单 ↓ 说明需要专业评估 ↓ 转执业医师</p></article><article class="rule-path"><span class="rid">R02</span><h3>STOP RECOMMENDATION</h3><p>明确拒绝</p><p>确认拒绝 ↓ 停止追问 ↓ 结束推荐</p></article><article class="rule-path"><span class="rid">R03</span><h3>NORMAL COMMUNICATION</h3><p>未命中专业风险 + 未明确拒绝 + 愿意继续了解</p><p>展示已审核方案方向，由顾客自行决定。</p></article></div><p class="conclusion reveal">规则层优先定义业务边界：哪些场景可以继续沟通，哪些场景必须停止或转交。</p></div>
<div class="design-module"><h3>判断结果必须进一步变成一线能直接执行的动作。</h3><div class="preview-card reveal"><span class="tag">SYSTEM DESIGN PREVIEW</span><h3>Action Card / R01</h3><div class="preview-columns"><div><b>判断依据</b><p>命中专业风险词。</p></div><div><b>动作顺序</b><p>停止推荐 → 专业评估 → 转交。</p></div><div><b>建议表达</b><p>说明需要由执业医师结合实际情况评估。</p></div><div><b>禁止事项</b><p>不判断适用性、恢复期或疗效。</p></div><div><b>边界与转交</b><p>立即转执业医师。</p></div></div></div></div>
<div class="design-module"><h3>自动规则只负责第一层判断，关键反馈仍然进入人工审核。</h3><p class="cs-copy">STORE STAFF 提交反馈 ↓ MANAGER 审核完整性 ↓ OPS 形成规则候选 ↓ ARCHIVE 保留完整事件时间线</p><span class="pill purple">Human-in-the-loop</span></div><div class="design-module"><h3>CASE LIFECYCLE</h3><p class="cs-copy">Created → Decision → Action Confirmed → Feedback → Manager Review → Ops Review → Archived</p></div></section>
<section class="cs-section" id="evidence"><span class="cs-label">07 / VALIDATION</span><h2 class="reveal">当前版本的验证范围聚焦于规则路径与运营闭环的可运行性。</h2><p class="cs-copy reveal">真实门店采用率、效率提升和商业结果仍待后续验证。</p><div class="evidence-numbers count-zone"><div><strong data-count="3">3</strong><span>Rule Paths</span></div><div><strong data-count="9">9</strong><span>Synthetic Test Cases</span></div><div><strong data-count="100" data-suffix="%">100%</strong><span>9 / 9 built-in synthetic cases</span></div><div><strong data-count="2">2</strong><span>Human Review Layers</span></div></div><div class="evidence-bars"><div>NORMAL · 3 / 3</div><div>REJECT · 3 / 3</div><div>HANDOFF · 3 / 3</div></div><div class="editorial-grid"><div><small>EVIDENCE</small><b>Persistent Case Archive</b></div><div><small>EVIDENCE</small><b>Search & Filter</b></div><div><small>EVIDENCE</small><b>Event Timeline</b></div><div><small>EVIDENCE</small><b>JSON / CSV Export</b></div></div><p class="disclaimer"><b>Validation Scope</b><br>当前结果来自 9 条合成场景，用于验证规则优先级和交互流程，不代表真实门店业务效果、医疗判断准确率或商业转化效果。</p></section>
<section class="cs-section demo-entry" id="demo"><span class="cs-label">FROM CASE STUDY<br>TO WORKING PROTOTYPE</span><h2>方案已转化为<br>可直接操作的系统原型。</h2><p>以下 Demo 为真实可交互 HTML 原型。所有案例均为合成或脱敏演示数据，不连接真实医疗、客户或企业系统。</p><a class="cs-btn" href="#home">ENTER INTERACTIVE DEMO ↗</a><p class="micro">No login · No API · Runs locally</p></section>
<section class="cs-section" id="reflection"><span class="cs-label">08 / REFLECTION</span><h2 class="reveal">当前版本已验证规则可运行性；真实业务结果仍待验证。</h2><div class="split"><div><h3>已验证</h3><p class="cs-copy">Rule Priority<br>Rejection Boundary<br>Closed-loop Workflow<br>Structured Data<br>Offline Prototype</p></div><div><h3>尚未验证</h3><p class="cs-copy">Real Store Adoption<br>Rule Recall / Precision<br>Operational Efficiency<br>Business Impact<br>Governance</p></div></div><div class="design-module"><h3>下一阶段将优先验证真实使用价值，再逐步扩展系统能力。</h3><p class="cs-copy">01 真实场景收集 → 02 误判 / 漏判分析 → 03 规则候选池 → 04 人工审核 → 05 灰度更新 → 06 效果复盘</p><p><span class="pill">Future Measurement Framework</span></p><p>动作卡采用率 · 专业风险正确转交率 · 明确拒绝后停止推荐率 · 规则误判率 · 一线反馈提交率 · 单案例处理时长 · 高质量案例沉淀率</p></div></section>
<section class="cs-section"><span class="cs-label">09 / WHAT THIS PROJECT PROVES</span><h2 class="reveal">这个项目将门店业务逻辑拆解并结构化为一套可运行系统。</h2><div class="matrix">${[['BUSINESS ABSTRACTION','把一线自然语言场景拆成结构化输入和业务规则。'],['RULE DESIGN','建立专业风险 > 明确拒绝 > 普通沟通的优先级。'],['SOP DESIGN','把判断转译成动作顺序、建议表达、禁止事项和转交条件。'],['FEEDBACK LOOP','建立执行 → 反馈 → 审核 → 规则候选机制。'],['VALIDATION','用 9 条合成测试验证核心路径。'],['VIBE CODING','把运营逻辑做成真实可运行的 HTML 原型。']].map((x,i)=>`<article><small>0${i+1}</small><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div><p class="conclusion">Vibe Coding 在本项目中承担快速产品化与验证工具角色，用于将已完成的业务逻辑转化为可测试原型。</p></section>
<section class="cs-section closing"><span class="cs-label">OXYLIFT / 2026</span><h2>Operations should not end with execution.<br>Good experience should become a system.</h2><p class="cs-copy">好的运营不应该只完成一次执行，而应该让一次经验成为下一次判断的基础。</p><div class="cs-actions"><a class="cs-btn" href="#overview">REPLAY CASE STUDY ↑</a><a class="cs-btn primary" href="#home">OPEN DEMO ↗</a></div></section></main>`}
function home(){return shell('从高保真 Demo，到可验证的门店动作工作台','现场输入 → 规则判断 → 动作卡 → 执行反馈 → 人工审核 → 脱敏案例档案。系统不替代医疗专业判断。',`<div class="grid"><section class="card"><h2>开始一条真实联动案例</h2><p>修改顾客原话后，规则判断、动作卡和档案会同步使用本次实际输入，不读取预设旧值。</p><div class="btns"><button class="btn primary" onclick="newCase()">开始场景判断</button></div></section><section class="card"><h2>当前证明材料</h2><p>已沉淀案例：<b>${cases.length}</b> 条</p><p>内置测试：<b>9</b> 条（普通、拒绝、专业风险各 3 条）</p><div class="btns"><button class="btn" onclick="nav('tests')">查看测试复盘</button><button class="btn" onclick="nav('archive')">打开案例档案</button></div></section></div>`)}
function newCase(){current=null;nav('scene')}
function editWorkspace(id){const el=document.getElementById(id),block=el.closest('.content-block');block.classList.add('editing');el.focus();if(el.select)el.select()}
function finishWorkspace(id){const el=document.getElementById(id),block=el.closest('.content-block'),display=block.querySelector('.content-display');block.classList.remove('editing');display.textContent=el.value.trim()||(id==='question'?'暂无未解决专业问题':'点击添加内容')}
function toggleProperty(id){document.querySelectorAll('.property-row.open').forEach(x=>{if(x.dataset.property!==id)x.classList.remove('open')});const row=document.querySelector(`[data-property="${id}"]`);row.classList.toggle('open');if(id==='category'&&row.classList.contains('open'))setTimeout(()=>row.querySelector('.property-inline-input').focus(),0)}
function setProperty(id,value){const el=document.getElementById(id);el.value=value;const row=document.querySelector(`[data-property="${id}"]`);row.querySelector('.property-value').textContent=value;row.classList.remove('open')}
function propertyInputKey(e,id){if(e.key==='Enter'){e.preventDefault();setProperty(id,e.currentTarget.value)}if(e.key==='Escape')e.currentTarget.closest('.property-row').classList.remove('open')}
function propertyRow(id,label,value,options){const menu=options?options.map(x=>`<button type="button" class="property-option ${x===value?'current':''}" onclick="setProperty('${id}','${x}')">${x}</button>`).join(''):`<input class="property-inline-input" value="${value}" onkeydown="propertyInputKey(event,'${id}')" onblur="setProperty('${id}',this.value)">`;return `<div class="property-row" data-property="${id}"><span class="property-name">${label}</span><button type="button" class="property-value" onclick="toggleProperty('${id}')">${value}</button><span class="property-chevron">›</span><div class="property-popover">${menu}</div></div>`}
function editableBlock(id,label,value,kind='textarea',extra=''){const tag=kind==='input'?`<input class="workspace-editor" id="${id}" value="${value}" onblur="finishWorkspace('${id}')">`:`<textarea class="workspace-editor" id="${id}" onblur="finishWorkspace('${id}')">${value}</textarea>`;const shown=value||(id==='question'?'暂无未解决专业问题':'点击添加内容');return `<section class="content-block ${extra}"><span class="content-label">${label}</span><button type="button" class="content-display" onclick="editWorkspace('${id}')">${shown}</button>${tag}</section>`}
function scene(){const v=current?.input||{category:'项目 A',stage:'方案沟通',quote:'预算有限，但愿意了解不同方案的区别。',goal:'比较方案差异',budget:'预算敏感',attitude:'愿意了解',question:''};const risk=riskWords.some(w=>v.question.includes(w));return shell('01 场景判断','将顾客现场表达结构化，并运行安全优先规则。',`<div class="case-layout"><section class="case-workspace"><span class="workspace-kicker">CASE / CURRENT INPUT</span><p class="workspace-summary">顾客当前${v.attitude==='明确拒绝'?'已明确拒绝':v.attitude==='愿意了解'?'愿意继续了解方案':'仍在考虑'}，${v.budget==='预算敏感'?'同时对预算敏感。':'等待进一步澄清。'}</p>${editableBlock('quote','CUSTOMER SAID',v.quote,'textarea','customer-said')}${editableBlock('goal','INTENT',v.goal,'input','intent-block')}${editableBlock('question','UNRESOLVED QUESTION',v.question,'textarea','question-block')}${risk?'<span class="risk-hint">Professional review required</span>':''}<div class="workspace-actions"><button class="btn primary" onclick="submitScene()">运行安全优先规则 →</button></div></section><aside class="case-inspector"><span class="inspector-title">CASE CONTEXT</span><div class="property-list">${propertyRow('category','品类',v.category)}${propertyRow('stage','服务阶段',v.stage,['方案沟通','初次了解','方案比较'])}${propertyRow('budget','预算敏感度',v.budget,['预算敏感','预算明确','尚未表达'])}${propertyRow('attitude','顾客态度',v.attitude,['愿意了解','犹豫','明确拒绝'])}</div><select class="property-source" id="stage"><option>${v.stage}</option><option>初次了解</option><option>方案比较</option></select><select class="property-source" id="budget"><option>${v.budget}</option><option>预算明确</option><option>尚未表达</option></select><select class="property-source" id="attitude"><option>${v.attitude}</option><option>愿意了解</option><option>犹豫</option><option>明确拒绝</option></select><input class="property-source" id="category" value="${v.category}"><div class="inspector-rules"><span class="inspector-title">RULE PRIORITY</span><div class="inspector-rule"><small>01</small><div><b>Professional Risk</b><span>专业风险优先转交</span></div></div><div class="inspector-rule"><small>02</small><div><b>Explicit Rejection</b><span>明确拒绝后停止推荐</span></div></div><div class="inspector-rule"><small>03</small><div><b>Normal Communication</b><span>其余场景继续沟通</span></div></div></div></aside></div>`)}
function submitScene(){const input={category:category.value.trim(),stage:stage.value,quote:quote.value.trim(),goal:goal.value.trim(),budget:budget.value,attitude:attitude.value,question:question.value.trim()};if(!input.quote||!input.goal){toast('请填写顾客原话和表达目标');return}current=makeCase(input);cases.unshift(current);persist();nav('actions')}
function decisionPathLabel(path){return path==='normal'?'NORMAL COMMUNICATION':path==='reject'?'STOP RECOMMENDATION':'PROFESSIONAL HANDOFF'}
function handoffLabel(path){return path==='reject'?'STOP CONDITION':path==='handoff'?'PROFESSIONAL HANDOFF':'HANDOFF CONDITION'}
function actions(){if(!current)return missing('请先完成场景判断。','scene');const c=current;return shell('02 升单动作卡','系统生成的业务决策简报：判断依据、行动步骤、表达建议与执行边界。',`<section class="decision-brief path-${c.decision.path}"><header class="decision-header"><div class="decision-meta"><span>RULE / ${c.decision.rule_id}</span><span class="decision-path">${decisionPathLabel(c.decision.path)}</span></div><h2 class="decision-title">${c.action.title}</h2><p class="decision-reason">${c.decision.reason}</p></header><div class="brief-layout"><div class="brief-main"><section class="action-sequence"><span class="brief-section-label">ACTION PLAN / 动作方案</span>${c.action.steps.map((x,i)=>`<div class="action-step"><span class="step-number">${String(i+1).padStart(2,'0')}</span><div class="step-title">${x}</div></div>`).join('')}</section><section class="suggested-script"><span class="brief-section-label">SUGGESTED EXPRESSION</span><blockquote class="script-block"><p>“${c.action.expression}”</p></blockquote></section></div><aside class="brief-inspector"><section class="brief-panel"><span class="brief-panel-title">CASE CONTEXT</span><div class="brief-context"><div><small>CASE ID</small><span>${c.case_id}</span></div><div><small>QUOTE</small><span>${c.input.quote}</span></div><div><small>RULE</small><span>${c.decision.rule_id}</span></div><div><small>PATH</small><span>${decisionPathLabel(c.decision.path)}</span></div></div></section><section class="brief-panel"><span class="brief-panel-title">GUARDRAILS / DO NOT</span><p class="guardrail-text">${c.action.forbidden}</p></section><section class="brief-panel"><span class="brief-panel-title">${handoffLabel(c.decision.path)}</span><span class="handoff-status">${c.decision.path==='handoff'?'Professional Handoff':c.decision.path==='reject'?'Recommendation Stopped':'Boundary Active'}</span><p class="handoff-text">${c.action.handoff}</p></section></aside></div><footer class="brief-actionbar"><button class="btn edit-action" onclick="nav('scene')">← Edit input</button><button class="btn primary" onclick="confirmAction()">Confirm action & continue →</button></footer></section>`)}
function confirmAction(){current.status='action_confirmed';current.events.push({type:'action_confirmed',time:now(),summary:`人工确认动作卡 v${current.action.version}`});sync();nav('feedback')}
function feedback(){if(!current)return missing('请先生成并确认动作卡。','scene');const f=current.feedback||{used:'是，直接采用',actual:'',reaction:'',result:'继续了解',note:''};return shell('03 反馈审核','记录执行事实，并让现场结果进入人工审核。',`<div class="case-layout"><section class="case-workspace"><span class="workspace-kicker">FEEDBACK / EXECUTION NOTES</span><p class="workspace-summary">记录实际动作与顾客原始反应。阅读态优先，点击内容即可临时编辑。</p>${editableBlock('actual','EXECUTION NOTES',f.actual,'textarea','intent-block')}${editableBlock('reaction','CUSTOMER REACTION',f.reaction,'textarea','customer-said')}${editableBlock('note','SANITIZED NOTE',f.note,'textarea','question-block')}<div class="workspace-actions"><button class="btn" onclick="saveFeedback(false)">保存草稿</button><button class="btn primary" onclick="saveFeedback(true)">提交店员反馈 →</button></div></section><aside class="case-inspector"><span class="inspector-title">FEEDBACK PROPERTIES</span><div class="property-list">${propertyRow('used','动作卡采用',f.used,['是，直接采用','否，未采用','修改后采用','转专业人员'])}${propertyRow('result','现场结果',f.result,['继续了解','明确拒绝','已转执业医师','完成本轮沟通'])}</div><select class="property-source" id="used"><option>${f.used}</option><option>否，未采用</option><option>修改后采用</option><option>转专业人员</option></select><select class="property-source" id="result"><option>${f.result}</option><option>明确拒绝</option><option>已转执业医师</option><option>完成本轮沟通</option></select><div class="inspector-rules review-panel"><span class="inspector-title">HUMAN REVIEW</span>${reviewPanel()}</div></aside></div>${eventStream(current.events)}`)}
function reviewPanel(){if(!current.feedback)return `<div class="lockbox">店员反馈提交后解锁店长审核。</div>`;const m=current.reviews.find(x=>x.role==='manager'),o=current.reviews.find(x=>x.role==='ops');return `${m?`<p>${badge('normal')} 店长：${m.result}<br><small>${m.time} · ${m.comment}</small></p>`:`<div class="data-field"><label>店长结论</label><textarea id="managerComment">反馈完整，可提交总部复核。</textarea></div><button class="btn primary" onclick="managerReview()">店长通过</button>`}${m&&!o?`<hr><div class="data-field"><label>总部结论</label><textarea id="opsComment">纳入下一轮规则候选，仍需人工发布。</textarea></div><button class="btn purple" onclick="opsReview()">总部完成审核</button>`:''}${o?`<p>${badge('handoff')} 总部：${o.result}<br><small>${o.time} · ${o.comment}</small></p><button class="btn" onclick="completeCase()">完成案例并进入档案</button>`:''}`}
function activityKind(e){if(e.type==='case_created')return'created';if(e.type==='decision')return'decision';if(e.type==='action_confirmed')return'action';if(e.type==='feedback')return'feedback';if(e.type==='review'&&e.summary.includes('店长'))return'manager';if(e.type==='review'&&e.summary.includes('总部'))return'ops';return'generic'}
function activityTitle(e){if(e.type==='case_created')return'创建案例档案';if(e.type==='action_confirmed')return e.summary.replace('人工确认','');return e.summary}
function activityMeta(e){if(e.type==='case_created')return'Case created · 脱敏输入快照';if(e.type==='decision')return'Rule decision · Safety-first priority';if(e.type==='action_confirmed')return'Manual confirmation';if(e.type==='feedback')return'Staff feedback';if(e.type==='review'&&e.summary.includes('店长'))return'Manager review';if(e.type==='review'&&e.summary.includes('总部'))return'Ops review · Rule candidate';return e.type.replaceAll('_',' ')}
function eventStream(events){return `<section class="activity-section"><header class="activity-heading"><span class="workspace-kicker">CASE ACTIVITY</span><h2>案例活动记录</h2><p>完整记录案例从创建、判断到人工审核的生命周期。</p></header><div class="event-stream">${events.map(e=>`<article class="event-row event-${activityKind(e)}"><span class="event-mark" aria-hidden="true"></span><div><div class="event-title">${activityTitle(e)}</div><span class="event-meta">${activityMeta(e)}</span></div><time class="event-time">${e.time}</time></article>`).join('')}</div></section>`}
function saveFeedback(submit){current.feedback={used:used.value,actual:actual.value.trim(),reaction:reaction.value.trim(),result:result.value,note:note.value.trim(),time:now()};current.updated_at=now();if(submit){current.status='manager_pending';current.events.push({type:'feedback',time:now(),summary:`店员提交反馈：${current.feedback.result}`})}sync();toast(submit?'店员反馈已提交':'反馈草稿已保存');render()}
function managerReview(){current.reviews.push({role:'manager',result:'approved',time:now(),comment:managerComment.value.trim()});current.status='ops_pending';current.events.push({type:'review',time:now(),summary:'店长审核通过'});sync();render()}
function opsReview(){current.reviews.push({role:'ops',result:'rule_candidate',time:now(),comment:opsComment.value.trim()});current.status='reviewed';current.events.push({type:'review',time:now(),summary:'总部审核完成，形成下一轮规则候选'});sync();render()}
function completeCase(){current.status='reviewed';current.updated_at=now();sync();nav('archive')}
function sync(){const i=cases.findIndex(x=>x.case_id===current.case_id);if(i>=0)cases[i]=current;persist()}
function archive(){const q='';return shell('04 脱敏案例档案','检索、查看、导出和删除门店业务案例；刷新页面后档案仍然存在。',`<section class="archive-surface"><div class="archive-tools"><div class="toolbar-field"><input id="search" placeholder="搜索案例编号、品类或顾客原话" oninput="filterArchive()"></div><div class="toolbar-field select-field"><select id="pathFilter" onchange="filterArchive()"><option value="">全部路径</option><option value="normal">普通沟通</option><option value="reject">明确拒绝</option><option value="handoff">专业转交</option></select></div><div class="toolbar-field select-field"><select id="statusFilter" onchange="filterArchive()"><option value="">全部状态</option><option value="draft">草稿</option><option value="reviewed">已审核</option></select></div><button class="btn" onclick="exportJSON()">导出 JSON</button><button class="btn" onclick="exportCSV()">导出 CSV</button></div><div id="archiveList">${archiveRows(cases)}</div></section>`)}
function archiveRows(items){if(!items.length)return'<div class="lockbox">暂无案例。请先完成一条场景判断。</div>';return`<div class="archive-list">${items.map(c=>`<article class="archive-row"><div><b>${c.case_id}</b><small>${c.created_at}</small></div><div>${c.input.category}<small>${c.input.quote}</small></div><div>${badge(c.decision.path)}<small>${c.decision.rule_id}</small></div><div><span class="pill">${c.status}</span><small>${c.feedback?.result||'尚无现场反馈'}</small></div><div><button class="btn" onclick="openCase('${c.case_id}')">查看</button><button class="btn danger" onclick="deleteCase('${c.case_id}')">删除</button></div></article>`).join('')}</div>`}
function filterArchive(){const q=search.value.toLowerCase(),p=pathFilter.value,s=statusFilter.value;const list=cases.filter(c=>(!q||JSON.stringify(c).toLowerCase().includes(q))&&(!p||c.decision.path===p)&&(!s||c.status===s));archiveList.innerHTML=archiveRows(list)}
function openCase(id){current=cases.find(c=>c.case_id===id);nav('detail')}
function detail(){if(!current)return missing('未找到案例。','archive');return shell('案例详情','完整查看输入快照、命中规则、动作卡版本、反馈和人工审核时间线。',`<section class="card"><div class="context"><div><small>案例编号</small><strong>${current.case_id}</strong></div><div><small>创建时间</small><strong>${current.created_at}</strong></div><div><small>路径</small><strong>${badge(current.decision.path)}</strong></div><div><small>状态</small><strong>${current.status}</strong></div></div><h2>输入快照</h2><pre>${escapeHtml(JSON.stringify(current.input,null,2))}</pre><h2>系统判断</h2><p>${current.decision.rule_id} · ${current.decision.reason}</p><h2>动作卡 v${current.action.version}</h2><p>${current.action.title}</p><h2>反馈与审核</h2><pre>${escapeHtml(JSON.stringify({feedback:current.feedback,reviews:current.reviews},null,2))}</pre><div class="btns"><button class="btn" onclick="nav('archive')">返回案例档案</button></div></section>${eventStream(current.events)}`)}
function deleteCase(id){cases=cases.filter(c=>c.case_id!==id);if(current?.case_id===id)current=null;persist();render()}
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download('oxylift-cases.json','application/json',JSON.stringify(cases,null,2))}
function exportCSV(){const rows=[['case_id','created_at','category','path','rule_id','status','result'],...cases.map(c=>[c.case_id,c.created_at,c.input.category,c.decision.path,c.decision.rule_id,c.status,c.feedback?.result||''])];download('oxylift-cases.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n'))}
function testPage(){const results=tests.map(t=>{const actual=decide({quote:t.quote,question:'',attitude:t.attitude}).path;return{...t,actual,pass:actual===t.expect}});const passed=results.filter(x=>x.pass).length;return shell('Synthetic Validation','用 9 条合成案例验证普通、拒绝和专业风险三类规则路径，而不代表真实业务或医疗准确性。',`<section class="card"><div class="context"><div><small>Synthetic Test Cases</small><strong>9</strong></div><div><small>Built-in Tests Passed</small><strong>${passed} / 9</strong></div><div><small>Rule Paths</small><strong>3</strong></div><div><small>Validation Type</small><strong>Demo</strong></div></div><div class="test-grid">${results.map(x=>`<div class="group"><h3>${x.name} ${x.pass?'<span class="pill green">通过</span>':'<span class="pill">失败</span>'}</h3><p>${x.quote}</p><small>预期：${x.expect} · 实际：${x.actual}</small></div>`).join('')}</div><div class="notice"><b>Validation Scope：</b>这 9 条合成场景用于验证规则优先级和交互流程，不代表真实门店业务效果、医疗判断准确率或商业转化效果。</div></section>`)}
function missing(msg,to){return shell('步骤尚未完成',msg,`<section class="card lockbox"><button class="btn primary" onclick="nav('${to}')">前往正确步骤</button></section>`)}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const demoRoutes=['home','scene','actions','feedback','archive','detail','tests'];
function headerFor(isDemo){return isDemo?`<header class="demo-header"><a class="brand" href="#home"><i>O</i><b>氧升 OXYLIFT</b></a><span class="mode">DEMO MODE</span><nav><a href="#scene">场景判断</a><a href="#actions">升单动作卡</a><a href="#feedback">反馈审核</a><a href="#archive">案例档案</a><a href="#tests">测试复盘</a></nav><a class="back" href="#overview">← BACK TO CASE STUDY</a></header>`:`<header class="portfolio-header"><a class="brand" href="#overview"><i>O</i><b>OXYLIFT</b></a><nav><a href="#overview">Overview</a><a href="#problem">Problem</a><a href="#system">System</a><a href="#evidence">Evidence</a><a href="#demo">Demo</a><a href="#reflection">Reflection</a></nav><a class="enter" href="#home">ENTER DEMO ↗</a></header>`}
function initPortfolio(){const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const reveal=document.querySelectorAll('.reveal');if(reduced)reveal.forEach(x=>x.classList.add('visible'));else{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});reveal.forEach(x=>io.observe(x))}const flow=document.querySelector('.flow-trigger');if(flow){if(reduced)flow.querySelectorAll('.flow-node').forEach(x=>x.classList.add('active'));else{const fio=new IntersectionObserver(es=>{if(es[0].isIntersecting){flow.querySelectorAll('.flow-node').forEach((x,i)=>setTimeout(()=>x.classList.add('active'),i*110));fio.disconnect()}},{threshold:.25});fio.observe(flow)}}const zone=document.querySelector('.count-zone');if(zone&&!reduced){const cio=new IntersectionObserver(es=>{if(!es[0].isIntersecting)return;zone.querySelectorAll('[data-count]').forEach(el=>{const end=+el.dataset.count,start=performance.now();const tick=t=>{const p=Math.min(1,(t-start)/900);el.textContent=Math.round(end*p)+(el.dataset.suffix||'');if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});cio.disconnect()},{threshold:.4});cio.observe(zone)}if(!reduced)document.querySelectorAll('.hero-item').forEach((x,i)=>{x.style.opacity='0';x.style.transform='translateY(18px)';x.style.filter='blur(7px)';x.style.transition='opacity .75s,transform .75s,filter .75s';setTimeout(()=>{x.style.opacity='1';x.style.transform='none';x.style.filter='none'},120+i*120)})}
function render(){const r=route(),isDemo=demoRoutes.includes(r);document.body.classList.toggle('portfolio',!isDemo);siteHeader.innerHTML=headerFor(isDemo);document.querySelector('#app').innerHTML=!isDemo?portfolio():r==='scene'?scene():r==='actions'?actions():r==='feedback'?feedback():r==='archive'?archive():r==='detail'?detail():r==='tests'?testPage():home();window.scrollTo(0,0);if(!isDemo){requestAnimationFrame(()=>{initPortfolio();const target=document.getElementById(r);if(target&&r!=='overview')target.scrollIntoView()})}}
let progressTick=false;addEventListener('scroll',()=>{if(progressTick)return;progressTick=true;requestAnimationFrame(()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max?scrollY/max*100:0)+'%';progressTick=false})},{passive:true});
addEventListener('hashchange',render);render();

</script></body></html>
